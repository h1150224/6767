<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電子病例記錄系統</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h2 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 8px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    textarea { resize: vertical; height: 80px; }
    button { background-color: #3498db; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #2980b9; }
    .record-card { background: #fafafa; border-left: 4px solid #3498db; padding: 10px; margin-top: 10px; border-radius: 4px; }
  </style>
</head>
<body>

<div class="container">
  <h2>新增病例記錄</h2>
  <form id="patientForm">
    <div class="form-group">
      <label for="name">病患姓名：</label>
      <input type="text" id="name" required>
    </div>
    <div class="form-group">
      <label for="date">就診日期：</label>
      <input type="date" id="date" required>
    </div>
    <div class="form-group">
      <label for="symptoms">主訴與症狀：</label>
      <textarea id="symptoms" required></textarea>
    </div>
    <div class="form-group">
      <label for="diagnosis">診斷結果與醫囑：</label>
      <textarea id="diagnosis" required></textarea>
    </div>
    <button type="submit">儲存病例</button>
  </form>

  <h2>病例歷史紀錄</h2>
  <div id="recordsList"></div>
</div>

<script>
  const form = document.getElementById('patientForm');
  const recordsList = document.getElementById('recordsList');

  // 讀取本地儲存的病例
  function loadRecords() {
    recordsList.innerHTML = '';
    const records = JSON.parse(localStorage.getItem('medicalRecords')) || [];
    records.forEach((record, index) => {
      const card = document.createElement('div');
      card.className = 'record-card';
      card.innerHTML = `
        <strong>${record.name}</strong> (${record.date})<br>
        <strong>主訴：</strong> ${record.symptoms}<br>
        <strong>診斷：</strong> ${record.diagnosis}
      `;
      recordsList.appendChild(card);
    });
  }

  // 儲存病例至 localStorage
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const newRecord = {
      name: document.getElementById('name').value,
      date: document.getElementById('date').value,
      symptoms: document.getElementById('symptoms').value,
      diagnosis: document.getElementById('diagnosis').value
    };

    const records = JSON.parse(localStorage.getItem('medicalRecords')) || [];
    records.push(newRecord);
    localStorage.setItem('medicalRecords', JSON.stringify(records));

    form.reset();
    loadRecords();
  });

  // 初始載入
  loadRecords();
</script>

</body>
</html>
